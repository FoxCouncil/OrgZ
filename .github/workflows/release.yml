name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64

    runs-on: ${{ matrix.os }}

    # Same environment NAPLPS uses, so the signing secrets live in one place and a human
    # approves each release run before any certificate is touched.
    environment: appstore

    # id-token is what azure/login needs for OIDC federated credentials, so no client
    # secret has to live in the repo. Harmless on the jobs that don't sign.
    permissions:
      contents: read
      id-token: write

    # The presence checks for the signing credentials live HERE and nowhere else.
    #
    # `secrets` is not one of the contexts available to a step-level `if` - GitHub's context
    # availability table grants it to `jobs.<job_id>.env` and to `with:`/`env:`, but not to
    # `jobs.<job_id>.if` or `jobs.<job_id>.steps.if`. Naming it there doesn't evaluate to
    # empty, it makes the whole workflow FILE invalid: every run fails at zero seconds with
    # "workflow file issue" before a single job starts, which is how a tag can look pushed
    # and produce no release at all. Hoisting the check into job env gives the steps a plain
    # string flag to gate on, and keeps the "unset credentials degrade to an unsigned build"
    # behaviour intact.
    env:
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
      HAS_APPLE_SIGNING: ${{ secrets.DEVID_CERT_P12 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        shell: bash
        # Checked here rather than discovered inside `vpk pack` twenty minutes later: vpk wants
        # SemVer, so a four-part tag (v1.2.3.4) or a typo fails after three platforms have
        # already published, leaving a half-finished release.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-prerelease]; vpk needs SemVer."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      # PINNED, deliberately. A bare `dotnet tool install -g vpk` takes whatever is newest,
      # and 1.2.0 shipped a bug where a quiet MSI install ignored --instLocation and landed
      # in C:\{packId} instead of Program Files (velopack@b894097b, fixed 2026-07-01). That
      # directory carries an Authenticated-Users Modify ACE, so the LocalSystem service
      # binary became writable by any standard user - a local privilege escalation we found
      # by installing the thing in a VM. Unpinned build tooling is how it reached us.
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.110-ge826545

      # Pull OUR vetted, SHA-256-pinned ffmpeg/flac/lame from the encoders release (see
      # scripts/encoders.json) into tools/<rid>/ so the publish step bundles them. Tools not yet
      # vendored are skipped - the app just falls back to a PATH install for those.
      - name: Bundle media tools (ffmpeg + rip encoders)
        shell: pwsh
        run: scripts/fetch-encoders.ps1 -Rid ${{ matrix.rid }}

      - name: Publish
        run: dotnet publish OrgZ.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Strip cross-platform runtimes
        shell: bash
        # `dotnet publish -r <rid> --self-contained` mostly does this, but some
        # NuGet packages still drop sibling-RID assets into publish/runtimes/.
        # Trimming them shrinks the Velopack release by ~300 MB.
        run: |
          if [ -d publish/runtimes ]; then
            case "${{ matrix.rid }}" in
              osx-*)   keep_glob='osx*' ;;
              linux-*) keep_glob='linux*' ;;
              win-*)   keep_glob='win*' ;;
              *)       keep_glob='*' ;;
            esac
            find publish/runtimes -mindepth 1 -maxdepth 1 -type d \
              ! -name "$keep_glob" ! -name 'unix' -exec rm -rf {} +
          fi

      - name: Bundle libvlc (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: scripts/fetch-vlc-mac.sh publish ${{ matrix.rid == 'osx-arm64' && 'arm64' || 'intel64' }}

      # Invoked through `bash` rather than directly: this repo is developed on Windows with
      # core.fileMode=false, so a new script lands in git as 100644 and executing it by path
      # would fail with "Permission denied" on the runner.
      - name: Bundle libvlc (Linux)
        if: matrix.rid == 'linux-x64'
        run: bash scripts/fetch-vlc-linux.sh publish

      # vpk builds the AppImage by shelling out to mksquashfs, which the GitHub-hosted
      # Ubuntu image does NOT carry - its own error message is literally "sudo apt install
      # squashfs-tools". Without this the Linux leg fails at pack time, and because the
      # release and docs jobs both `needs: build`, one failed leg means the tag produces no
      # release on ANY platform.
      - name: Install AppImage build tooling (Linux)
        if: matrix.rid == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      # ── Code signing ──────────────────────────────────────────────────────────
      # Every signing step is CONDITIONAL on its secrets existing, so a release still
      # builds (unsigned) before the accounts are set up, and an expired credential
      # degrades to an unsigned build rather than a failed one. See SIGNING.md.

      - name: Azure login for Artifact Signing
        if: ${{ matrix.rid == 'win-x64' && env.HAS_AZURE_SIGNING == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write Artifact Signing metadata
        if: ${{ matrix.rid == 'win-x64' && env.HAS_AZURE_SIGNING == 'true' }}
        shell: bash
        run: |
          # vpk hands this to the bundled signtool.exe, which authenticates with
          # DefaultAzureCredential - picked up from the az login above. Must be UTF-8, no BOM.
          cat > "$RUNNER_TEMP/signing-metadata.json" <<JSON
          {
            "Endpoint": "${{ secrets.AZURE_TS_ENDPOINT }}",
            "CodeSigningAccountName": "${{ secrets.AZURE_TS_ACCOUNT }}",
            "CertificateProfileName": "${{ secrets.AZURE_TS_PROFILE }}"
          }
          JSON
          # RUNNER_TEMP is a Windows path (D:\a\_temp) and the pack step runs SIGN_ARGS through
          # `eval`, which eats backslashes: D:\a\_temp would reach vpk as D:a_temp and signing
          # would fail on a file that plainly exists. Hand eval forward slashes, quoted.
          SIGN_FILE="${RUNNER_TEMP//\\//}/signing-metadata.json"
          echo "SIGN_ARGS=--azureTrustedSignFile \"$SIGN_FILE\"" >> "$GITHUB_ENV"

      - name: Import Developer ID certificates
        if: ${{ startsWith(matrix.rid, 'osx-') && env.HAS_APPLE_SIGNING == 'true' }}
        shell: bash
        env:
          DEVID_CERT_P12: ${{ secrets.DEVID_CERT_P12 }}
          DEVID_CERT_PASSWORD: ${{ secrets.DEVID_CERT_PASSWORD }}
          DEVID_INSTALLER_CERT_P12: ${{ secrets.DEVID_INSTALLER_CERT_P12 }}
          DEVID_INSTALLER_CERT_PASSWORD: ${{ secrets.DEVID_INSTALLER_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Dedicated keychain rather than login: the runner is ephemeral and the certs
          # shouldn't land in a shared store. Same shape as the NAPLPS release job.
          KEYCHAIN="$RUNNER_TEMP/orgz-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$DEVID_CERT_P12" | base64 -d > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$DEVID_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"

          # Velopack ships a .pkg, so unlike NAPLPS's dmg this ALSO needs the Developer ID
          # Installer certificate - productbuild signs the package, codesign signs the app.
          printf '%s' "$DEVID_INSTALLER_CERT_P12" | base64 -d > "$RUNNER_TEMP/devid-installer.p12"
          security import "$RUNNER_TEMP/devid-installer.p12" -k "$KEYCHAIN" \
            -P "${DEVID_INSTALLER_CERT_PASSWORD:-$DEVID_CERT_PASSWORD}" -T /usr/bin/productbuild -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/devid-installer.p12"

          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          # Without this, codesign prompts for keychain access and hangs a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Notarize with the App Store Connect API key, not an app-specific password.
          printf '%s' "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials "orgz-notary" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

          # Read the identity names out of the keychain rather than storing them as secrets -
          # they're not secret, and a mismatch between a stored string and the actual cert is
          # a needless way to fail.
          APP_ID="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          INST_ID="$(security find-identity -v "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Installer: [^"]*\)".*/\1/p' | head -1)"
          if [ -z "$APP_ID" ] || [ -z "$INST_ID" ]; then
            echo "::error::Missing a Developer ID identity (app='$APP_ID' installer='$INST_ID'). Velopack needs BOTH."
            exit 1
          fi
          echo "Signing as: $APP_ID / $INST_ID"

          echo "SIGN_ARGS=--keychain \"$KEYCHAIN\" --notaryProfile orgz-notary --signAppIdentity \"$APP_ID\" --signInstallIdentity \"$INST_ID\"" >> "$GITHUB_ENV"

      - name: Pack with Velopack
        shell: bash
        # Windows ships the MSI only. It installs PerMachine (Program Files + HKLM) and is
        # therefore elevated, which is the only way OrgZ's after-install hook can register
        # the LocalSystem background service - so every Windows install gets silent disc
        # and iPod access instead of a UAC prompt per operation.
        #
        # vpk always builds Setup.exe and generates the MSI inside that same step (see
        # CreateSetupPackage in Velopack.Packaging.Windows), so --noInst would suppress
        # BOTH. Build both and drop the one we don't publish. The auto-updater doesn't
        # touch Setup.exe - it consumes the .nupkg + releases.json - so removing it only
        # removes a second, weaker way to install.
        run: |
          WIN_FLAGS=""
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            # --runtime is NOT optional here: vpk warns "defaulting to x86" without it, and
            # the WiX template picks [ProgramFiles64Folder] vs [ProgramFilesFolder] off
            # exactly that. Getting it wrong installs a 64-bit app into Program Files (x86).
            WIN_FLAGS="--icon Assets/app.ico --msi --instLocation PerMachine --runtime ${{ matrix.rid }}"
          fi

          # Everyone gets an icon and a real title. Without --icon the AppImage and the .app
          # carry Velopack's placeholder artwork, which is what the user sees in their dock,
          # their launcher and their file manager.
          #
          # One container per platform, and vpk REFUSES the wrong one rather than converting:
          # macOS demands .icns ("icon must have a '.icns' extension"), Windows .ico, and the
          # AppImage takes the PNG. Assets/app.icns is generated from app-icon-1024.png with
          # sips + iconutil, which only exist on a Mac - hence it lives in the repo.
          COMMON_FLAGS="--packAuthors FoxCouncil --packTitle OrgZ"
          case "${{ matrix.rid }}" in
            osx-*)   COMMON_FLAGS="$COMMON_FLAGS --icon Assets/app.icns" ;;
            linux-*) COMMON_FLAGS="$COMMON_FLAGS --icon Assets/app-icon-1024.png" ;;
          esac

          # Velopack's default channel is the OS, not the RID, so two macOS legs would both
          # write OrgZ-osx-Setup.pkg and RELEASES-osx and overwrite each other on the release.
          #
          # Only the Intel leg is renamed. UpdateManager resolves its channel from the one the
          # app was INSTALLED from, and every Mac install that already exists came from the
          # default "osx" channel - moving Apple Silicon to "osx-arm64" would point those
          # installs at a feed that stopped being published, and they would silently never
          # update again. Apple Silicon keeps the default; Intel is the new arrival, so it is
          # the one that gets a name.
          if [[ "${{ matrix.rid }}" == "osx-x64" ]]; then
            COMMON_FLAGS="$COMMON_FLAGS --channel osx-x64"
          fi
          # SIGN_ARGS is set only when the signing secrets exist; empty otherwise, so an
          # unconfigured repo still produces a working (unsigned) release.
          #
          # Scoped to platforms that have a signing path. Linux never sets SIGN_ARGS, so an
          # unconditional warning fires on every green release and stops meaning anything.
          if [[ -n "${SIGN_ARGS:-}" ]]; then
            echo "Signing enabled."
          elif [[ "${{ matrix.rid }}" == linux-* ]]; then
            echo "No signing step for linux-x64; the AppImage is published as-is."
          else
            echo "::warning::No signing credentials for ${{ matrix.rid }} - it will be UNSIGNED (SmartScreen warnings on Windows, Gatekeeper refusal on macOS). See SIGNING.md."
          fi

          eval vpk pack -u OrgZ -v ${{ steps.version.outputs.VERSION }} -p publish -o releases $COMMON_FLAGS $WIN_FLAGS ${SIGN_ARGS:-}

          if [[ "${{ matrix.rid }}" == win-* ]]; then
            rm -f releases/OrgZ-win-Setup.exe
          fi

          # Assert the installer this platform's download link points at actually exists, because
          # the release body below hard-codes these names and a mismatch ships a 404.
          #
          # The naming rule is {id}-{channel}{suffix} - EXCEPT on Linux. Velopack's
          # DefaultName.GetSuggestedPortableName special-cases it: when the channel equals the
          # default for the OS (and nothing here passes --channel, so it always does) the Linux
          # AppImage gets NO channel segment. Verified by calling that method directly against
          # the pinned CLI: win -> OrgZ-win.msi, osx -> OrgZ-osx-Setup.pkg, linux -> OrgZ.AppImage.
          # The Intel leg passes an explicit --channel (see above), so its name carries it:
          # OrgZ-osx-x64-Setup.pkg. Apple Silicon stays on the default and keeps its old name.
          case "${{ matrix.rid }}" in
            win-*)   expected=OrgZ-win.msi ;;
            osx-arm64) expected=OrgZ-osx-Setup.pkg ;;
            osx-x64)   expected=OrgZ-osx-x64-Setup.pkg ;;
            linux-*) expected=OrgZ.AppImage ;;
          esac
          if [[ ! -f "releases/$expected" ]]; then
            echo "::error::vpk did not produce $expected - the release body links a file that will not exist."
            ls -la releases/
            exit 1
          fi

      # ── MSI post-processing ───────────────────────────────────────────────────
      # Runs after pack, so it INVALIDATES the MSI's Authenticode signature - the re-sign below
      # is part of this pair, not optional. vpk emits the install hook as a deferred impersonated
      # custom action, so `sc create` inside it never gets an elevated token. See the script.
      - name: Elevate the MSI install hooks (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: scripts/msi-elevate-hooks.ps1 -MsiPath releases/OrgZ-win.msi

      # Only the MSI is re-signed; other artifacts keep the signature vpk gave them.
      - name: Re-sign the patched MSI (Windows)
        if: ${{ matrix.rid == 'win-x64' && env.HAS_AZURE_SIGNING == 'true' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: ${{ github.workspace }}/releases
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A patched-but-unsigned MSI means a SmartScreen block for every user. Fail here instead.
      - name: Verify the MSI signature survived (Windows)
        if: ${{ matrix.rid == 'win-x64' && env.HAS_AZURE_SIGNING == 'true' }}
        shell: pwsh
        run: |
          $status = (Get-AuthenticodeSignature 'releases/OrgZ-win.msi').Status
          Write-Host "MSI signature: $status"
          if ($status -ne 'Valid') {
            Write-Error "MSI signature is '$status' after patching - the re-sign did not take."
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: releases/

  # Docs follow the release cycle: every tag publishes its own docs version (mike), so an
  # installed app's Help > Manual link resolves to its own version's pages. Needs build (not
  # release) so it runs alongside the release job rather than after it - it wants the signal
  # that every platform's installer packed, not any artifact from it. Without that gate a
  # failed build would still move the "latest" alias to a version nobody can install.
  docs:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PINNED, for the same reason `vpk` is. An unpinned `pip install` here takes whatever
      # is newest on the day a tag is cut, and the Material for MkDocs team have announced
      # that MkDocs 2.0 removes the plugin system outright with no migration path - so the
      # first release after it lands would fail on a docs job nobody had touched. Verified
      # building this site with --strict.
      - name: Install dependencies
        run: pip install "mkdocs-material==9.7.7" "mike==2.2.0"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy versioned docs
        run: mike deploy --push --update-aliases "${GITHUB_REF_NAME#v}" latest

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate release body
        id: body
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}"
          cat > body.md << EOF
          ## Download OrgZ v${VERSION}

          | Platform | Installer | Portable |
          |----------|-----------|----------|
          | Windows (x64) | [OrgZ-win.msi](${BASE}/OrgZ-win.msi) | [OrgZ-win-Portable.zip](${BASE}/OrgZ-win-Portable.zip) |
          | macOS (Apple Silicon) | [OrgZ-osx-Setup.pkg](${BASE}/OrgZ-osx-Setup.pkg) | [OrgZ-osx-Portable.zip](${BASE}/OrgZ-osx-Portable.zip) |
          | macOS (Intel) | [OrgZ-osx-x64-Setup.pkg](${BASE}/OrgZ-osx-x64-Setup.pkg) | [OrgZ-osx-x64-Portable.zip](${BASE}/OrgZ-osx-x64-Portable.zip) |
          | Linux (x64) | [OrgZ.AppImage](${BASE}/OrgZ.AppImage) | - |

          <details><summary>Other files in this release are used by the auto-updater.</summary>

          The \`.nupkg\`, \`.json\`, and \`RELEASES\` files are consumed by OrgZ's built-in update mechanism. You don't need to download them manually.
          </details>
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: body.md
          fail_on_unmatched_files: false
